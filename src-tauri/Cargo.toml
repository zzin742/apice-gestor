[package]
name = "apice-gestor"
version = "0.1.0"
description = "Ápice Gestor — painel do dia do colaborador"
authors = ["Ápice"]
edition = "2021"

[lib]
name = "apice_gestor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
