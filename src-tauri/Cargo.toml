[package]
name = "apice-gestor"
version = "0.1.0"
description = "Ápice Gestor — painel do dia do colaborador"
authors = ["Ápice"]
edition = "2021"

[lib]
name = "apice_gestor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Registry", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
