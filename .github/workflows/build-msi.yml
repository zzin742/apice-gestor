# Gera o .msi do Ápice Gestor em windows-latest (Tauri não cruza-compila do macOS).
#
# O que este workflow FAZ: compila e guarda o .msi como artefato do run (aba Actions → run → Artifacts).
# O que ele NÃO faz, de propósito:
#   - não assina (pendente: decisão de certificado do José Luiz);
#   - não cria GitHub Release nem publica manifesto do updater — publicar para máquina de
#     colaborador é ato do José Luiz ("manda bala"), nunca automático.
name: build-msi

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Endereço da API do Hub embutido no .msi (ex.: https://<hub>/api/gestor). Vazio = sem endereço."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Por evento: um push no main não cancela uma run manual (a da bancada) no meio.
  group: build-msi-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Antes de qualquer build: o Hub responde 307 de apicehub.com.br para www.apicehub.com.br, e o
      # reqwest descarta o Authorization quando o redirect troca de host. O enroll passaria e todo o
      # resto viraria 401, com o agente caindo no enrolamento em laço (recado do Farol, 08/10).
      - name: Confere api_base
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          $api = "$env:API_BASE".Trim()
          if (-not $api) { exit 0 }
          $uri = $null
          if (-not [Uri]::TryCreate($api, [UriKind]::Absolute, [ref]$uri) -or $uri.Scheme -notin 'http', 'https') {
            "::error title=api_base inválido::'$api' não é um endereço http(s) completo."
            exit 1
          }
          if ($uri.Host -ieq 'apicehub.com.br') {
            $certo = $api -replace '(?i)://apicehub\.com\.br', '://www.apicehub.com.br'
            "::error title=api_base sem www::'$api' está sem o www. O Hub redireciona (307) para o www e o agente perde o token no caminho: tudo vira 401. Use $certo"
            exit 1
          }
          "api_base ok: $api"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências da CLI do Tauri
        run: npm ci

      # O release lê GESTOR_API_BASE em tempo de compilação (src-tauri/src/api.rs, option_env!).
      # Decisão do José Luiz (08/10): o endereço só entra por INPUT MANUAL (workflow_dispatch), nunca
      # por variável fixa do repo, para nenhum build por push sair apontando para um lugar errado
      # por esquecimento. Build por push = sem endereço (o app responde "endereço não configurado").
      # Só exporta se tiver valor: string vazia viraria Some("") e o app chamaria URL quebrada.
      # http é aceito porque o mock da Ponte na rede local é http.
      - name: Build do .msi
        shell: pwsh
        env:
          API_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base || '' }}
        run: |
          $api = "$env:API_BASE".Trim()
          if ($api) {
            if ($api -notmatch '^https?://\S+$') { throw "api_base inválido: precisa ser http(s)://... sem espaços" }
            $env:GESTOR_API_BASE = $api
            "::notice::.msi com API do Hub: $api"
            "API do Hub embutida: ``$api``" >> $env:GITHUB_STEP_SUMMARY
            if ($api -like 'http://*') { "⚠️ http sem TLS — só para teste na rede local." >> $env:GITHUB_STEP_SUMMARY }
          } else {
            "::warning::Sem GESTOR_API_BASE — este .msi abre, mas responde 'endereço não configurado'. Não serve para a bancada."
            "⚠️ **Sem endereço do Hub** — .msi não serve para a bancada." >> $env:GITHUB_STEP_SUMMARY
          }
          # O serviço é crate separado do workspace (src-tauri/servico): o `tauri build` não o compila, e o
          # src-tauri/wix/servico.wxs o empacota. Mesmo passo e mesmo GESTOR_API_BASE: ele também fala com a API.
          cargo build --release --manifest-path src-tauri/Cargo.toml -p apice-gestor-servico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri build --bundles msi
          if ($LASTEXITCODE -ne 0) {
            # O tauri-bundler esconde a saída do candle/light; com -v ela aparece. A compilação já está
            # pronta, então só o empacotamento roda de novo.
            "::group::Falhou: empacotamento de novo com -v (saída do WiX)"
            npx tauri build --bundles msi -v
            "::endgroup::"
            exit 1
          }
          # Guarda o .msi da run e empacota DE NOVO (mesmo ambiente, sem recompilar): o WiX gera outro
          # ProductCode, e o teste usa o segundo .msi para uma atualização de verdade (H3, 4/4).
          New-Item -ItemType Directory -Force msi-1, msi-2 | Out-Null
          Move-Item src-tauri/target/release/bundle/msi/*.msi msi-1/
          npx tauri build --bundles msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item src-tauri/target/release/bundle/msi/*.msi msi-2/

      # O tauri-bundler nomeia o .msi como "{productName}_{versão}_{arch}_{idioma}.msi", com acento
      # e espaço ("Ápice Gestor_..."), e não oferece opção de config. Aqui ele vira um nome ASCII
      # estável, que é o que o scripts/instalar.ps1 espera.
      - name: Renomeia e calcula SHA-256
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem msi-1/*.msi)
          if ($msi.Count -ne 1) { throw "Esperava 1 .msi em msi-1, achei $($msi.Count)" }
          $versao = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nome = "apice-gestor_${versao}_x64.msi"
          New-Item -ItemType Directory -Force instalador | Out-Null
          Copy-Item $msi[0].FullName "instalador/$nome"
          $h = (Get-FileHash "instalador/$nome" -Algorithm SHA256).Hash.ToLower()
          # LF explícito: com CRLF, o `sha256sum -c` do Mac/Linux não acha o arquivo.
          [IO.File]::WriteAllText("$PWD/instalador/SHA256SUMS.txt", "$h  $nome`n")
          # Pacote de UM CLIQUE: o .msi, o hash e os dois scripts na mesma pasta.
          Copy-Item scripts/instalar.ps1, scripts/instalar.cmd instalador/
          "### $nome`n`nSHA-256 ``$h```n`nGerado de ``$($msi[0].Name)``. Sem assinatura — só para Parallels/bancada." >> $env:GITHUB_STEP_SUMMARY

      # Roda o scripts/instalar.ps1 de verdade com o .msi recém-gerado (o runner é administrador):
      # instala, repete (tem que ser "nada a fazer"), desinstala e confere que limpou. O enrolamento
      # fica de fora: precisa do Hub e de alguém digitando o código.
      - name: Teste do instalar.ps1 (instala com serviço, repete, recuperação, desinstala)
        shell: powershell
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          $s   = (Resolve-Path scripts/instalar.ps1).Path
          $msi = (Get-ChildItem instalador/*.msi)[0].FullName
          $exe = Join-Path $env:ProgramFiles (([char]0x00C1 + 'pice Gestor') + '\apice-gestor.exe')
          $log = Join-Path $env:ProgramData 'ApiceGestor\instalar.log'

          $nome = [char]0x00C1 + 'pice Gestor'
          $run  = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function NoRun { (Get-Item $run).GetValue($nome) }

          function Svc { Get-CimInstance Win32_Service -Filter "Name='ApiceGestor'" }

          # 1. Instala com um Run legado no HKCU (versão antiga): o .msi cria o serviço, o script confere
          #    e tira o Run (quem abre a cápsula agora é o serviço).
          # A imagem nova do windows-latest não traz a chave Run no perfil limpo (a antiga trazia), e o
          # -Force do New-ItemProperty cria o VALOR, não a CHAVE: cria a chave se faltar.
          New-Item -Path $run -Force | Out-Null
          New-ItemProperty -Path $run -Name $nome -Value "`"$exe`" --sessao" -Force | Out-Null
          & $s -Msi $msi -SemEnrolar
          if ($LASTEXITCODE -ne 0) { throw "instalar falhou ($LASTEXITCODE)" }
          if (-not (Test-Path $exe)) { throw "exe nao instalado em $exe" }
          # O .msi traz o serviço? (tabela ServiceInstall; hoje não, até o serviço virar crate próprio)
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi, 0))
          try {
            $vw = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Name FROM ServiceInstall"))
            $vw.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $vw, $null) | Out-Null
            $temServico = $null -ne $vw.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $vw, $null)
          } catch { $temServico = $false }
          ".msi com servico: $temServico"

          if ($temServico) {
            $v = Svc
            if (-not $v) { throw 'servico ApiceGestor nao foi criado pelo .msi' }
            "servico: $($v.State) / $($v.StartMode) / $($v.StartName) / $($v.PathName)"
            if ($v.State -ne 'Running' -or $v.StartMode -ne 'Auto' -or $v.StartName -ne 'LocalSystem') { throw 'servico fora do esperado' }
            if ($v.PathName -notlike '*apice-gestor-servico.exe*') { throw "binario do servico errado: $($v.PathName)" }
            if ($null -ne (NoRun)) { throw 'Run legado ficou com o servico instalado' }
          } else {
            if (Svc) { throw 'servico criado por um .msi que nao o declara' }
            if ((NoRun) -ne "`"$exe`" --sessao") { throw "sem servico, o Run tinha que ficar: '$(NoRun)'" }
          }

          # 2. Repete: nada a fazer, e o Run continua fora.
          & $s -Msi $msi -SemEnrolar
          if ($LASTEXITCODE -ne 0) { throw "segunda execucao falhou ($LASTEXITCODE)" }
          if (-not (Select-String -Path $log -Pattern 'nada a fazer' -Quiet)) { throw 'segunda execucao reinstalou: nao e idempotente' }
          if ($temServico -and $null -ne (NoRun)) { throw 'Run regravado com o servico instalado' }

          # 2b. Cofre da máquina: com um device.token presente, instalar SEM -SemEnrolar tem que
          #     reconhecer a máquina como enrolada (etapa elevada) e não pedir código (o CI não tem Hub).
          $cofre = Join-Path $env:ProgramData 'ApiceGestor\device.token'
          Set-Content -LiteralPath $cofre -Value 'token-de-teste-do-CI'
          & $s -Msi $msi
          if ($LASTEXITCODE -ne 0) { throw "instalar com cofre presente falhou ($LASTEXITCODE)" }
          if (-not (Select-String -Path $log -Pattern 'enrolada \(cofre' -Quiet)) { throw 'nao reconheceu o cofre da maquina' }
          # Um clique com a máquina já enrolada: não gasta o código.
          & $s -Msi $msi -Codigo 'TESTE-CI-0001'
          if ($LASTEXITCODE -ne 0) { throw "-Codigo com cofre presente devia sair 0 ($LASTEXITCODE)" }
          if (Select-String -Path $log -Pattern 'uma tentativa com o c' -Quiet) { throw '-Codigo tentou enrolar uma maquina ja enrolada' }
          # Código com formato inválido: recusa antes de tudo (saída 2), sem instalar nem chamar o exe.
          & $s -Msi $msi -Codigo 'x y;z'
          if ($LASTEXITCODE -ne 2) { throw "codigo com formato invalido devia sair 2 ($LASTEXITCODE)" }

          # 3. Recuperação: matar o processo do serviço → o Windows sobe de novo (reinicia em 60 s).
          if ($temServico) {
          $pid1 = (Svc).ProcessId
          Stop-Process -Id $pid1 -Force
          $ok = $false
          foreach ($i in 1..24) { Start-Sleep 5; $v = Svc; if ($v.State -eq 'Running' -and $v.ProcessId -ne $pid1) { $ok = $true; break } }
          if (-not $ok) { throw "o servico nao voltou em 120 s depois de morto (estado: $((Svc).State))" }
          "servico voltou sozinho: pid $pid1 -> $((Svc).ProcessId)"
          }

          # 3b. ATUALIZAÇÃO (H3): segundo .msi (ProductCode novo) por cima, com o serviço rodando e uma
          #     cápsula aberta. Tem que instalar sem "pede reinício" (arquivo em uso) e o serviço tem
          #     que terminar rodando, do pacote novo. (O runner não tem sessão interativa: o serviço não
          #     relança a cápsula aqui; isso só a bancada prova.)
          if ($temServico) {
            $msi2 = (Get-ChildItem msi-2/*.msi)[0].FullName
            $wi2 = New-Object -ComObject WindowsInstaller.Installer
            $db2 = $wi2.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi2, @($msi2, 0))
            $vw2 = $db2.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db2, @("SELECT Value FROM Property WHERE Property='ProductCode'"))
            $vw2.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $vw2, $null) | Out-Null
            $rec2 = $vw2.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $vw2, $null)
            $pc2 = $rec2.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec2, 1)
            $vw2.GetType().InvokeMember('Close', 'InvokeMethod', $null, $vw2, $null) | Out-Null
            if ((Svc).State -ne 'Running') { throw 'antes da atualizacao o servico tinha que estar rodando' }
            Start-Process -FilePath $exe | Out-Null    # capsula aberta durante a troca
            Start-Sleep 3
            $antes = @(Get-Content $log).Count
            & $s -Msi $msi2 -SemEnrolar
            if ($LASTEXITCODE -ne 0) { throw "atualizacao falhou ($LASTEXITCODE)" }
            $novas = @(Get-Content $log | Select-Object -Skip $antes)
            $novas
            if (-not ($novas -match 'substituindo')) { throw 'nao foi uma atualizacao (esperava "substituindo")' }
            if ($novas -match 'rein.{1,2}cio') { throw 'atualizacao pediu reinicio: arquivo em uso (H3)' }
            $v = Svc
            if ($v.State -ne 'Running') { throw "servico nao voltou depois da atualizacao ($($v.State))" }
            $wi3 = New-Object -ComObject WindowsInstaller.Installer
            $inst = @($wi3.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null, $wi3, @('{97800A68-CABD-52E3-886A-6D8831965CFF}')))
            if ($inst.Count -ne 1 -or $inst[0] -ne $pc2) { throw "depois da atualizacao, produtos instalados: $($inst -join ', ') (esperado so $pc2)" }
            "atualizacao ok: ProductCode $pc2, servico Running"
          }

          # 4. Desinstala: some o serviço, o exe e o Run.
          & $s -Desinstalar
          if ($LASTEXITCODE -ne 0) { throw "desinstalar falhou ($LASTEXITCODE)" }
          if (Test-Path $exe) { throw 'exe continua la depois de desinstalar' }
          if (Svc) { throw 'servico continua la depois de desinstalar' }
          if ($null -ne (NoRun)) { throw 'inicio automatico ficou em HKCU\Run' }
          # Token preservado por padrão; -RemoverToken apaga o cofre.
          if (-not (Test-Path -LiteralPath $cofre)) { throw 'desinstalar sem -RemoverToken apagou o cofre' }
          & $s -Desinstalar -RemoverToken
          if ($LASTEXITCODE -ne 0) { throw "desinstalar -RemoverToken falhou ($LASTEXITCODE)" }
          if (Test-Path -LiteralPath $cofre) { throw '-RemoverToken nao apagou o cofre' }

          # 4b. UM CLIQUE do zero (-Codigo), só em build sem endereço (push): instala, sobe o serviço,
          #     tenta enrolar UMA vez e sai 4 (sem conexão: "endereço não configurado"), sem perguntar
          #     nada e sem o código no log. Em workflow_dispatch o .msi fala com o Hub de produção, e o
          #     CI nunca manda código falso para lá.
          if ($env:EVENTO -ne 'workflow_dispatch') {
            $antes = @(Get-Content $log).Count
            # O instalar.cmd DO PACOTE, como no PC: o código entra pelo teclado (aqui, um pipe), vai
            # ao script pela variável APICE_CODIGO (só o --enrolar ainda o recebe como argumento, L1). O runner já é
            # administrador, então o .cmd não se relança.
            cmd /c "(echo TESTE-CI-0002& echo.) | instalador\instalar.cmd"
            $rc = $LASTEXITCODE
            $novas = @(Get-Content $log | Select-Object -Skip $antes)
            $novas
            if ($rc -ne 4) { throw "um clique sem endereco devia sair 4 (sem conexao), saiu $rc" }
            if (@($novas -match 'uma tentativa com o c').Count -ne 1) { throw 'um clique nao fez exatamente UMA tentativa' }
            if (Select-String -Path $log -Pattern 'TESTE-CI-000' -Quiet) { throw 'o codigo apareceu no log' }
            # stderr do --enrolar (motivo de IO/icacls) vai ao log; mostra o que veio (nao reprova).
            $err = @($novas -match '--enrolar \(stderr\)')
            "stderr do --enrolar no log: $($err.Count) linha(s)"
            $err
            if ((Svc).State -ne 'Running') { throw 'um clique nao deixou o servico rodando' }
            # Mensagem do --enrolar lida em UTF-8: nada de acento quebrado no log ("Ã§", "Ã£"...).
            # Padrão = Ã seguido de ¡..¿, com distinção de caixa (sem ela, "Ã" casaria o "ã" de "não").
            # Montado com [char] porque este passo é lido como ANSI pelo Windows PowerShell 5.1.
            # Diagnostico (nao reprova): o que a busca antiga, sem distincao de caixa, casava; os A-til
            # maiusculos; e U+FFFD (linha gravada em ANSI e lida como UTF-8). Mostra a origem de cada um.
            # Regex com \uXXXX (comparacao caractere a caractere). -SimpleMatch compara pelas regras de
            # idioma do .NET Framework: ignora caixa (A-til casava o a-til minusculo) e trata U+FFFD como
            # ignoravel (casava TODA linha). Os dois falsos positivos apareceram nas runs 38408819072 e
            # 38411042494.
            $antiga = @(Select-String -Path $log -Encoding UTF8 -Pattern '\u00C3')
            "diagnostico: busca antiga (sem caixa) casou $($antiga.Count) linha(s):"
            $antiga | ForEach-Object { "  L$($_.LineNumber): $($_.Line)" }
            $maiusc = @(Select-String -Path $log -Encoding UTF8 -Pattern '\u00C3' -CaseSensitive)
            "diagnostico: A-til MAIUSCULO em $($maiusc.Count) linha(s):"
            $maiusc | ForEach-Object { "  L$($_.LineNumber): $($_.Line)" }
            $fffd = @(Select-String -Path $log -Encoding UTF8 -Pattern '\uFFFD' -CaseSensitive)
            "diagnostico: U+FFFD (gravado em ANSI) em $($fffd.Count) linha(s):"
            $fffd | ForEach-Object { "  L$($_.LineNumber): $($_.Line)" }
            # Reprova: a sequencia do acento quebrado (A-til + ¡..¿, com caixa) ou qualquer U+FFFD.
            $quebrado = '\u00C3[\u00A1-\u00BF]'
            $ruins = @(Select-String -Path $log -Encoding UTF8 -CaseSensitive -Pattern $quebrado)
            if ($ruins -or $fffd) {
              $ruins | ForEach-Object { "acento quebrado L$($_.LineNumber): $($_.Line)" }
              throw 'texto com acento quebrado no instalar.log (ver as linhas acima)'
            }
            if (Test-Path -LiteralPath $cofre) { throw 'cofre gravado sem enrolar' }
            & $s -Desinstalar
            if ($LASTEXITCODE -ne 0 -or (Svc)) { throw 'desinstalar depois do um clique falhou' }
            "um clique (instalar.cmd) ok: instalou, servico Running, uma tentativa, saida 4, codigo fora do log"
          }

          # 5. Serviço órfão (MSI antigo ou falha no meio): o -Desinstalar tem que apagá-lo, mesmo sem
          #    app instalado. O binário é qualquer um: o serviço nem chega a iniciar.
          & sc.exe create ApiceGestor binPath= "C:\Windows\System32\cmd.exe /c exit" start= demand | Out-Null
          if (-not (Get-Service ApiceGestor -ErrorAction SilentlyContinue)) { throw 'nao consegui criar o servico de teste' }
          & $s -Desinstalar
          if ($LASTEXITCODE -ne 0) { throw "desinstalar 2x falhou ($LASTEXITCODE)" }
          if (Get-Service ApiceGestor -ErrorAction SilentlyContinue) { throw 'servico orfao continua la' }
          "--- instalar.log ---"; Get-Content $log

      - uses: actions/upload-artifact@v6
        with:
          name: apice-gestor-msi-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && inputs.api_base != '' && 'com-api' || 'sem-api' }}
          path: |
            instalador/*.msi
            instalador/SHA256SUMS.txt
            instalador/instalar.ps1
            instalador/instalar.cmd
          if-no-files-found: error
          retention-days: 14

      # Gate do land (exigências do Diretor): o ensaio() do cofre tem que passar ANTES da rede, e não
      # pode tropeçar no que já está na pasta. Sem endereço, o --enrolar para em "endereço não
      # configurado" antes do cofre; aqui o app é recompilado (depois do upload: o artefato não muda)
      # com um endereço de porta FECHADA. Cada caso começa da pasta limpa e diz o nome no erro:
      #   G0  pasta nova e pasta existente: saída 4, zero "cofre:", dono da pasta = Administradores.
      #   G1  o Vinny (f90b27d): instalar.log e servico.log com DACL hostil (dono = runner, só SYSTEM,
      #       sem WRITE_OWNER para Administradores). Controle: o setowner /T antigo tem que falhar ali.
      #       Exige saída 4, zero "cofre:", dono da pasta 544 e os dois arquivos intactos.
      #   G2  servico.log aberto com FileShare.None durante o --enrolar: saída 4. Controle com ele
      #       aberto: setowner direto nele passa (o erro 5 do Vinny é permissão, não compartilhamento).
      #   G3  device.token.tmp e device.token.probe pré-plantados: saída 4 e os dois somem.
      #   G4  device.token pré-plantado com DACL hostil: saída 6, "cofre:" com setowner no stderr,
      #       sem device.token.tmp (falha fechada ANTES do POST).
      #   G5  ApiceGestor como junction para outra pasta: saída 6 com o motivo (junction), nada
      #       escrito no alvo e o ACL do alvo intacto.
      # O runner é administrador.
      - name: Cofre antes da rede (--enrolar contra porta fechada, G0-G5)
        shell: pwsh
        run: |
          $env:GESTOR_API_BASE = 'http://127.0.0.1:9/api/gestor'
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force cofre-teste | Out-Null
          Copy-Item src-tauri/target/release/apice-gestor.exe cofre-teste/
          $exe   = (Resolve-Path cofre-teste/apice-gestor.exe).Path
          $pasta = Join-Path $env:ProgramData 'ApiceGestor'
          $cofre = Join-Path $pasta 'device.token'
          $adm   = 'S-1-5-32-544'
          $sys   = 'S-1-5-18'
          $eu    = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $sid   = [Security.Principal.SecurityIdentifier]

          # Volta ao zero: toma a posse (takeown liga o privilégio), reseta o ACL e apaga. Junction
          # sai com rmdir (não segue o link).
          function Limpar([string]$alvo) {
            if (-not (Test-Path -LiteralPath $alvo)) { return }
            if ((Get-Item -LiteralPath $alvo -Force).LinkType) { cmd /c rmdir "$alvo"; return }
            takeown /F $alvo /R /A /D Y *> $null
            icacls $alvo /reset /T /C /Q *> $null
            Remove-Item -LiteralPath $alvo -Recurse -Force
            if (Test-Path -LiteralPath $alvo) { throw "nao consegui limpar $alvo" }
          }
          # Quem aparece no DACL (SIDs, sem repetir).
          function Quem([string]$arq) {
            @((Get-Acl -LiteralPath $arq).GetAccessRules($true, $true, $sid) |
              ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
          }
          # Arquivo hostil: dono = runner (não Administradores) e DACL protegida só com SYSTEM.
          function Hostil([string]$arq) {
            Set-Content -LiteralPath $arq -Value 'plantado pelo gate' -Encoding utf8
            icacls $arq /setowner "*$eu" /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "nao consegui pôr o dono em $arq" }
            icacls $arq /inheritance:r /grant:r "*${sys}:F" /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "nao consegui fechar o ACL de $arq" }
            # /inheritance:r tira só o HERDADO. Na run 38601784876 (arquivo no RUNNER_TEMP) Administradores
            # sobreviveu a ele: havia ACE explícita. Tudo que não é SYSTEM sai uma a uma; o runner é o
            # dono, então tem WRITE_DAC implícito pra isso.
            foreach ($s in (Quem $arq | Where-Object { $_ -ne $sys })) {
              icacls $arq /remove "*$s" /Q | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "nao consegui tirar $s do ACL de $arq" }
            }
            $a = Get-Acl -LiteralPath $arq
            if ($a.GetOwner($sid).Value -ne $eu) { throw "pre-condicao: dono de $arq nao e o runner: $($a.Sddl)" }
            if (-not $a.AreAccessRulesProtected) { throw "pre-condicao: $arq ainda herda: $($a.Sddl)" }
            $quem = (Quem $arq) -join ','
            if ($quem -ne $sys) { throw "pre-condicao: DACL de $arq devia ser so SYSTEM, e ${quem}: $($a.Sddl)" }
          }
          function Sddl([string]$arq) { (Get-Acl -LiteralPath $arq).Sddl }
          function Enrolar([string]$caso) {
            $out = Join-Path $env:RUNNER_TEMP 'cofre-out.txt'
            $err = Join-Path $env:RUNNER_TEMP 'cofre-err.txt'
            $p = Start-Process -FilePath $exe -ArgumentList '--enrolar', 'TESTE-CI-0003' -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $r = [pscustomobject]@{
              Saida  = $p.ExitCode
              Stdout = @(Get-Content $out -Encoding UTF8 -ErrorAction SilentlyContinue)
              Stderr = @(Get-Content $err -Encoding UTF8 -ErrorAction SilentlyContinue)
            }
            # Write-Host: o que vai ao pipeline vira o retorno da função.
            Write-Host "[$caso] saida $($r.Saida)"
            $r.Stdout | ForEach-Object { Write-Host "  stdout: $_" }
            $r.Stderr | ForEach-Object { Write-Host "  stderr: $_" }
            $r
          }
          function Exigir([bool]$ok, [string]$caso, [string]$msg) { if (-not $ok) { throw "[$caso] $msg" } }
          function LinhasCofre($r) { @($r.Stderr -match '^\s*cofre:') }
          function DonoPasta { (Get-Acl -LiteralPath $pasta).GetOwner($sid).Value }
          function Passou([string]$caso, $r) {
            Exigir ((LinhasCofre $r).Count -eq 0) $caso 'o ensaio do cofre falhou (linha cofre: no stderr)'
            Exigir ($r.Saida -eq 4) $caso "devia sair 4 (sem conexao), saiu $($r.Saida)"
            Exigir (-not (Test-Path -LiteralPath $cofre)) $caso 'cofre gravado sem enrolar'
            Exigir (-not (Test-Path -LiteralPath "$cofre.probe")) $caso 'sobrou o device.token.probe'
            Exigir (-not (Test-Path -LiteralPath "$cofre.tmp")) $caso 'sobrou o device.token.tmp'
            Exigir ((DonoPasta) -eq $adm) $caso "dono da pasta e $(DonoPasta), devia ser Administradores ($adm)"
          }

          # G0: pasta nova, depois a mesma pasta já existente.
          Limpar $pasta
          foreach ($caso in 'G0 pasta nova', 'G0 pasta existente') {
            $r = Enrolar $caso; Passou $caso $r
            "[$caso] ok"
          }

          # G1: o Vinny. Controle primeiro, numa cópia ao lado (mesmo ProgramData): o setowner /T do
          # f90b27d tem que dar acesso negado NO instalar.log, não na pasta.
          $caso = 'G1 DACL hostil (Vinny)'
          $ctl = Join-Path $env:ProgramData 'ApiceGestor-controle-g1'
          Limpar $ctl
          New-Item -ItemType Directory -Force $ctl | Out-Null
          Hostil (Join-Path $ctl 'instalar.log')
          $saidaCtl = @(icacls $ctl /setowner "*$adm" /T 2>&1 | ForEach-Object { "$_" })
          $rcCtl = $LASTEXITCODE
          $saidaCtl | ForEach-Object { "  controle: $_" }
          Exigir ($rcCtl -ne 0) $caso 'controle: o setowner /T antigo NAO falhou; o cenario nao reproduz o Vinny'
          Exigir (@($saidaCtl -match 'instalar\.log').Count -ge 1) $caso 'controle: o setowner /T falhou, mas nao no instalar.log'
          Limpar $ctl
          Limpar $pasta
          New-Item -ItemType Directory -Force $pasta | Out-Null
          $arqs = 'instalar.log', 'servico.log' | ForEach-Object { Join-Path $pasta $_ }
          # Tamanho e data saem da listagem da pasta: o runner, dono sem leitura, não abre o conteúdo.
          function Marca([string]$arq) { $i = Get-Item -LiteralPath $arq -Force; "$($i.Length)|$($i.LastWriteTimeUtc.Ticks)|$(Sddl $arq)" }
          $antes = @{}
          foreach ($a in $arqs) { Hostil $a; $antes[$a] = Marca $a }
          $r = Enrolar $caso; Passou $caso $r
          foreach ($a in $arqs) {
            Exigir (Test-Path -LiteralPath $a) $caso "$a sumiu"
            Exigir ((Marca $a) -eq $antes[$a]) $caso "$a mudou (tamanho|data|SDDL): $($antes[$a]) -> $(Marca $a)"
          }
          "[$caso] ok: os dois arquivos intactos"

          # G2: servico.log aberto sem compartilhamento durante o --enrolar. Controle, com ele ainda
          # aberto: um setowner direto nele tem que passar (FileShare não bloqueia WRITE_OWNER); o erro
          # 5 do Vinny é permissão, não arquivo aberto.
          $caso = 'G2 servico.log aberto'
          Limpar $pasta
          New-Item -ItemType Directory -Force $pasta | Out-Null
          $log = Join-Path $pasta 'servico.log'
          $fs = [IO.File]::Open($log, 'OpenOrCreate', 'ReadWrite', 'None')
          try {
            $r = Enrolar $caso
            $saidaCtl = icacls $log /setowner "*$adm" 2>&1
            $rcCtl = $LASTEXITCODE
          } finally { $fs.Dispose() }
          $saidaCtl | ForEach-Object { "  controle: $_" }
          Passou $caso $r
          Exigir ($rcCtl -eq 0) $caso "controle: setowner no servico.log aberto saiu $rcCtl; arquivo aberto derruba o setowner"
          "[$caso] ok"

          # G3: sobras de uma tentativa interrompida.
          $caso = 'G3 tmp e probe plantados'
          Limpar $pasta
          New-Item -ItemType Directory -Force $pasta | Out-Null
          Set-Content -LiteralPath "$cofre.tmp" -Value 'sobra' -Encoding utf8
          Set-Content -LiteralPath "$cofre.probe" -Value 'sobra' -Encoding utf8
          $r = Enrolar $caso; Passou $caso $r
          "[$caso] ok: os dois sumiram"

          # G4: device.token com DACL hostil: falha fechada antes do POST.
          $caso = 'G4 device.token hostil'
          Limpar $pasta
          New-Item -ItemType Directory -Force $pasta | Out-Null
          Hostil $cofre
          $r = Enrolar $caso
          Exigir ($r.Saida -eq 6) $caso "devia sair 6 (cofre), saiu $($r.Saida)"
          Exigir (@(LinhasCofre $r | Where-Object { $_ -match 'setowner' }).Count -ge 1) $caso 'sem linha cofre: com setowner no stderr'
          Exigir (-not (Test-Path -LiteralPath "$cofre.tmp")) $caso 'sobrou o device.token.tmp'
          "[$caso] ok: saida 6, falhou fechado"

          # G5: a pasta do cofre é uma junction para outro lugar.
          $caso = 'G5 junction'
          Limpar $pasta
          $alvo = Join-Path $env:RUNNER_TEMP 'alvo-junction'
          Limpar $alvo
          New-Item -ItemType Directory -Force $alvo | Out-Null
          $sddlAlvo = Sddl $alvo
          New-Item -ItemType Junction -Path $pasta -Target $alvo | Out-Null
          $r = Enrolar $caso
          Exigir ($r.Saida -eq 6) $caso "devia sair 6 (cofre), saiu $($r.Saida)"
          Exigir (@(LinhasCofre $r | Where-Object { $_ -match '(?i)junction|reparse|jun..o|link' }).Count -ge 1) $caso 'sem o motivo (junction) na linha cofre: do stderr'
          Exigir (@(Get-ChildItem -LiteralPath $alvo -Force).Count -eq 0) $caso 'escreveu no alvo da junction'
          Exigir ((Sddl $alvo) -eq $sddlAlvo) $caso 'mexeu no ACL do alvo da junction'
          Limpar $pasta
          Limpar $alvo
          "[$caso] ok: saida 6, nada no alvo"
          "gate do cofre: G0-G5 verdes"
          # Cada caso falha com throw; o $LASTEXITCODE que sobra é o da última limpeza, não um veredito.
          exit 0

  # O instalar.ps1 roda no Windows PowerShell 5.1 (o que vem no Windows 10 da bancada). Aqui só se
  # confere que ele é lido inteiro por esse PowerShell (sintaxe e BOM) e passa no PSScriptAnalyzer.
  instalar-ps1:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: BOM e sintaxe no Windows PowerShell 5.1
        shell: powershell
        run: |
          $f = 'scripts/instalar.ps1'
          $b = [IO.File]::ReadAllBytes($f)
          if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { throw "$f precisa estar em UTF-8 com BOM" }
          $tokens = $null; $erros = $null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros) { $erros | ForEach-Object { "::error file=$f,line=$($_.Extent.StartLineNumber)::$($_.Message)" }; exit 1 }
          if ((Get-Content $f -Raw -Encoding UTF8) -notmatch [char]0x00C1) { throw 'Acentos nao lidos como UTF-8' }
          "Windows PowerShell $($PSVersionTable.PSVersion): sintaxe ok"

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          # A PowerShell Gallery falha de vez em quando (NoMatchFoundForCriteria, 13/10): 3 tentativas.
          $v = '1.23.0'
          foreach ($i in 1..3) {
            if (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq $v }) { break }
            try { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion $v -Repository PSGallery -ErrorAction Stop }
            catch { "tentativa $i de baixar o PSScriptAnalyzer falhou: $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $i) }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $v -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path scripts/instalar.ps1 -Severity Error,Warning `
               -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSUseApprovedVerbs,PSUseSingularNouns
          $r | ForEach-Object { "::$(if ($_.Severity -eq 'Error') {'error'} else {'warning'}) file=scripts/instalar.ps1,line=$($_.Line)::$($_.RuleName): $($_.Message)" }
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }
