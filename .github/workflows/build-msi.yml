# Gera o .msi do Ápice Gestor em windows-latest (Tauri não cruza-compila do macOS).
#
# O que este workflow FAZ: compila e guarda o .msi como artefato do run (aba Actions → run → Artifacts).
# O que ele NÃO faz, de propósito:
#   - não assina (pendente: decisão de certificado do José Luiz);
#   - não cria GitHub Release nem publica manifesto do updater — publicar para máquina de
#     colaborador é ato do José Luiz ("manda bala"), nunca automático.
name: build-msi

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências da CLI do Tauri
        run: npm ci

      # O release lê GESTOR_API_BASE em tempo de compilação (src-tauri/src/api.rs, option_env!).
      # Vem da variável do repo (Settings → Variables), não de segredo: é um endereço, não credencial.
      # Só exporta se tiver valor — string vazia viraria Some("") e o app chamaria URL quebrada em vez
      # de responder "endereço não configurado".
      - name: Build do .msi
        shell: pwsh
        env:
          API_BASE: ${{ vars.GESTOR_API_BASE }}
        run: |
          if ($env:API_BASE) {
            if ($env:API_BASE -notmatch '^https://') { throw "GESTOR_API_BASE precisa começar com https://" }
            $env:GESTOR_API_BASE = $env:API_BASE
            "API do Hub: ``$env:API_BASE``" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "::warning::GESTOR_API_BASE não definida — este .msi abre, mas responde 'endereço não configurado'. Não serve para a bancada."
            "⚠️ **GESTOR_API_BASE não definida** — .msi sem endereço do Hub, não serve para a bancada." >> $env:GITHUB_STEP_SUMMARY
          }
          npx tauri build --bundles msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # O tauri-bundler nomeia o .msi como "{productName}_{versão}_{arch}_{idioma}.msi", com acento
      # e espaço ("Ápice Gestor_..."), e não oferece opção de config. Aqui ele vira um nome ASCII
      # estável, que é o que o scripts/instalar.ps1 espera.
      - name: Renomeia e calcula SHA-256
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($msi.Count -ne 1) { throw "Esperava 1 .msi em src-tauri/target/release/bundle/msi, achei $($msi.Count)" }
          $versao = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nome = "apice-gestor_${versao}_x64.msi"
          New-Item -ItemType Directory -Force instalador | Out-Null
          Copy-Item $msi[0].FullName "instalador/$nome"
          $h = (Get-FileHash "instalador/$nome" -Algorithm SHA256).Hash.ToLower()
          # LF explícito: com CRLF, o `sha256sum -c` do Mac/Linux não acha o arquivo.
          [IO.File]::WriteAllText("$PWD/instalador/SHA256SUMS.txt", "$h  $nome`n")
          "### $nome`n`nSHA-256 ``$h```n`nGerado de ``$($msi[0].Name)``. Sem assinatura — só para Parallels/bancada." >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: apice-gestor-msi-${{ github.sha }}
          path: |
            instalador/*.msi
            instalador/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
